[package]
name = "mtrans"
version = "0.1.0"
edition = "2024"
authors = ["Jetsung <i@jetsung.com>"]
license = "Apache-2.0"
repository = "https://github.com/jetsung/mtrans"
description = "Copy container images to a target registry (and pull them back to local) via remote GitHub Actions workflows"
keywords = ["docker", "mirror", "cache", "github-actions", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "docker-mtrans"
path = "src/main.rs"

[dependencies]
aes = "0.9"
base64 = "0.22"
bollard = "0.21.1"
getrandom = "0.3"
pbkdf2 = "0.12"
sha2 = "0.10"
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
futures-util = "0.3.34"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.1.4"

# rustc 1.97 起默认透传链接器 stderr（linker_messages lint），
# 本机 GNU ld 对 rustc 传入的 -O 参数会打印 "ignoring deprecated linker
# optimization setting '1'"，属误报，故关闭该 lint。
[lints.rust]
linker_messages = "allow"

[package.metadata.deb]
maintainer = "Jetsung Chan <i@jetsung.com>"
assets = [
    ["target/release/docker-mtrans", "usr/bin/docker-mtrans", "755"],
]

[package.metadata.generate-rpm]
maintainer = "Jetsung Chan <i@jetsung.com>"
assets = [
    { source = "target/release/docker-mtrans", dest = "/usr/bin/docker-mtrans", mode = "755" },
]
